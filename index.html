<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rock Paper Scissors</title>
  <style>
    /* ── Reset & Base ───────────────────────────────── */
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
      color: #fff;
    }

    /* ── Selection Screen (State 1.1) ──────────────── */
    #selection-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }

    #selection-screen h1 {
      font-size: 2.4rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
    }

    .choices {
      position: relative;
      width: 400px;
      height: 360px;
    }

    .choice-btn {
      position: absolute;
      background: none;
      border: 4px solid rgba(255, 255, 255, 0.15);
      border-radius: 50%;
      width: 140px;
      height: 140px;
      cursor: pointer;
      transition: transform 0.25s, border-color 0.25s, box-shadow 0.25s;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
    }

    .choice-btn img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: none;
    }

    .choice-btn:hover {
      transform: scale(1.12);
      border-color: rgba(255, 255, 255, 0.6);
      box-shadow: 0 0 30px rgba(255, 255, 255, 0.2);
    }

    /* Triangular layout */
    .choice-btn[data-choice="rock"]     { top: 200px; left: 0; }
    .choice-btn[data-choice="paper"]    { top: 0;     left: 50%; transform: translateX(-50%); }
    .choice-btn[data-choice="scissors"] { top: 200px; right: 0; }

    .choice-btn[data-choice="paper"]:hover { transform: translateX(-50%) scale(1.12); }

    .choice-label {
      position: absolute;
      width: 100%;
      text-align: center;
      font-size: 0.85rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      opacity: 0.7;
      pointer-events: none;
    }

    .choice-btn[data-choice="rock"] .choice-label     { bottom: -28px; }
    .choice-btn[data-choice="paper"] .choice-label     { bottom: -28px; }
    .choice-btn[data-choice="scissors"] .choice-label  { bottom: -28px; }

    /* ── Showdown (State 1.2) ──────────────────────── */
    #showdown-screen {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 32px;
    }

    .showdown-area {
      display: flex;
      align-items: center;
      gap: 48px;
    }

    .showdown-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .showdown-card img {
      width: 160px;
      height: 160px;
      object-fit: contain;
    }

    .showdown-card .label {
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      opacity: 0.7;
    }

    .vs-text {
      font-size: 2rem;
      font-weight: 900;
      opacity: 0.5;
    }

    .user-card img {
      animation: slideInLeft 0.5s ease-out both;
    }

    .cpu-card img {
      animation: slideInRight 0.6s ease-out 0.3s both;
    }

    @keyframes slideInLeft {
      from { opacity: 0; transform: translateX(-80px) scale(0.6); }
      to   { opacity: 1; transform: translateX(0) scale(1); }
    }

    @keyframes slideInRight {
      from { opacity: 0; transform: translateX(80px) scale(0.6); }
      to   { opacity: 1; transform: translateX(0) scale(1); }
    }

    /* ── WIN (State 1.3 / 2.1) ─────────────────────── */
    #win-screen {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .win-text {
      font-size: 8rem;
      font-weight: 900;
      letter-spacing: 12px;
      background: linear-gradient(90deg, #f7971e, #ffd200, #f7971e);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: winPulse 0.6s ease-out, shimmer 1.5s linear infinite;
      text-shadow: none;
    }

    @keyframes winPulse {
      0%   { transform: scale(0.2); opacity: 0; }
      60%  { transform: scale(1.15); opacity: 1; }
      100% { transform: scale(1); }
    }

    @keyframes shimmer {
      to { background-position: 200% center; }
    }

    .win-fade-out {
      animation: fadeOut 0.8s ease-in forwards;
    }

    @keyframes fadeOut {
      to { opacity: 0; transform: scale(0.8); }
    }

    /* Burst particles */
    .burst-container {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .burst-particle {
      position: absolute;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      top: 50%;
      left: 50%;
    }

    /* ── Gift Box (State 2.2) ──────────────────────── */
    #gift-screen {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
    }

    .gift-box {
      width: 200px;
      height: 200px;
      cursor: pointer;
      transition: transform 0.2s;
    }

    .gift-box:hover {
      transform: scale(1.08);
    }

    .gift-box img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .gift-drop {
      animation: giftDrop 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    }

    @keyframes giftDrop {
      0%   { transform: translateY(-110vh) rotate(-15deg); }
      70%  { transform: translateY(20px) rotate(3deg) scaleY(0.85) scaleX(1.1); }
      85%  { transform: translateY(-15px) rotate(-2deg) scaleY(1.05) scaleX(0.97); }
      95%  { transform: translateY(5px) rotate(1deg) scaleY(0.97) scaleX(1.02); }
      100% { transform: translateY(0) rotate(0) scaleY(1) scaleX(1); }
    }

    .gift-hint {
      font-size: 1rem;
      opacity: 0;
      letter-spacing: 1px;
      animation: fadeIn 0.5s ease-out 1s forwards;
    }

    @keyframes fadeIn {
      to { opacity: 0.6; }
    }

    /* ── Candy Reveal (State 2.3) ──────────────────── */
    #candy-screen {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
    }

    .candy-reveal {
      position: relative;
      width: 220px;
      height: 220px;
    }

    .candy-reveal img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      animation: candyPop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    }

    @keyframes candyPop {
      0%   { transform: scale(0); opacity: 0; }
      60%  { transform: scale(1.2); opacity: 1; }
      100% { transform: scale(1); }
    }

    /* Sparkles */
    .sparkle {
      position: absolute;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ffd700;
      pointer-events: none;
    }

    @keyframes sparklePop {
      0%   { transform: translate(0, 0) scale(0); opacity: 1; }
      50%  { opacity: 1; }
      100% { transform: translate(var(--sx), var(--sy)) scale(1); opacity: 0; }
    }

    /* ── Play Again ────────────────────────────────── */
    .play-again-btn {
      margin-top: 24px;
      padding: 14px 40px;
      font-size: 1rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      border: 2px solid rgba(255, 255, 255, 0.4);
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      border-radius: 40px;
      cursor: pointer;
      transition: background 0.25s, border-color 0.25s;
      opacity: 0;
      animation: fadeIn 0.5s ease-out 0.8s forwards;
    }

    .play-again-btn:hover {
      background: rgba(255, 255, 255, 0.18);
      border-color: rgba(255, 255, 255, 0.7);
    }
  </style>
</head>
<body>

  <!-- ═══ STATE 1.1 — Selection Screen ═══ -->
  <div id="selection-screen">
    <h1>Choose Your Weapon</h1>
    <div class="choices">
      <button class="choice-btn" data-choice="paper">
        <img src="concept1/paper.png" alt="Paper" />
        <span class="choice-label">Paper</span>
      </button>
      <button class="choice-btn" data-choice="rock">
        <img src="concept1/rock.png" alt="Rock" />
        <span class="choice-label">Rock</span>
      </button>
      <button class="choice-btn" data-choice="scissors">
        <img src="concept1/scissors.png" alt="Scissors" />
        <span class="choice-label">Scissors</span>
      </button>
    </div>
  </div>

  <!-- ═══ STATE 1.2 — Showdown ═══ -->
  <div id="showdown-screen">
    <div class="showdown-area">
      <div class="showdown-card user-card">
        <img id="user-pick-img" src="" alt="Your pick" />
        <span class="label">You</span>
      </div>
      <span class="vs-text">VS</span>
      <div class="showdown-card cpu-card">
        <img id="cpu-pick-img" src="" alt="CPU pick" />
        <span class="label">CPU</span>
      </div>
    </div>
  </div>

  <!-- ═══ STATE 1.3 / 2.1 — WIN ═══ -->
  <div id="win-screen">
    <div class="win-text">WIN!</div>
    <div class="burst-container" id="burst-container"></div>
  </div>

  <!-- ═══ STATE 2.2 — Gift Box ═══ -->
  <div id="gift-screen">
    <div class="gift-box gift-drop" id="gift-box">
      <img src="concept1/present.png" alt="Gift Box" />
    </div>
    <span class="gift-hint">Tap the gift!</span>
  </div>

  <!-- ═══ STATE 2.3 — Candy Reveal ═══ -->
  <div id="candy-screen">
    <div class="candy-reveal" id="candy-reveal">
      <img src="concept1/candy.png" alt="Candy" />
    </div>
    <button class="play-again-btn" id="play-again-btn">Play Again</button>
  </div>

  <script>
    /* ── Asset map ──────────────────────────────────── */
    const ASSETS = {
      rock:     'concept1/rock.png',
      paper:    'concept1/paper.png',
      scissors: 'concept1/scissors.png',
    };

    /* The CPU always picks the losing choice */
    const LOSING_CHOICE = {
      rock:     'scissors',
      paper:    'rock',
      scissors: 'paper',
    };

    /* ── DOM refs ───────────────────────────────────── */
    const selectionScreen = document.getElementById('selection-screen');
    const showdownScreen  = document.getElementById('showdown-screen');
    const winScreen       = document.getElementById('win-screen');
    const giftScreen      = document.getElementById('gift-screen');
    const candyScreen     = document.getElementById('candy-screen');

    const userPickImg  = document.getElementById('user-pick-img');
    const cpuPickImg   = document.getElementById('cpu-pick-img');
    const burstContainer = document.getElementById('burst-container');
    const giftBox      = document.getElementById('gift-box');
    const candyReveal  = document.getElementById('candy-reveal');
    const playAgainBtn = document.getElementById('play-again-btn');

    /* ── Helpers ────────────────────────────────────── */
    function showOnly(screen) {
      [selectionScreen, showdownScreen, winScreen, giftScreen, candyScreen]
        .forEach(s => s.style.display = 'none');
      screen.style.display = 'flex';
    }

    function createBurstParticles() {
      burstContainer.innerHTML = '';
      const colors = ['#ffd700', '#ff6b6b', '#48dbfb', '#ff9ff3', '#fff', '#feca57'];
      for (let i = 0; i < 36; i++) {
        const p = document.createElement('div');
        p.className = 'burst-particle';
        const angle = (i / 36) * 360;
        const dist  = 120 + Math.random() * 160;
        const dx = Math.cos(angle * Math.PI / 180) * dist;
        const dy = Math.sin(angle * Math.PI / 180) * dist;
        const color = colors[Math.floor(Math.random() * colors.length)];
        const size  = 6 + Math.random() * 10;
        p.style.width  = size + 'px';
        p.style.height = size + 'px';
        p.style.background = color;
        p.style.animation = `burstMove${i} 0.8s ease-out forwards`;

        const keyframes = `
          @keyframes burstMove${i} {
            0%   { transform: translate(0,0) scale(1); opacity: 1; }
            100% { transform: translate(${dx}px, ${dy}px) scale(0); opacity: 0; }
          }`;
        const style = document.createElement('style');
        style.textContent = keyframes;
        document.head.appendChild(style);

        burstContainer.appendChild(p);
      }
    }

    function createSparkles() {
      const container = candyReveal;
      for (let i = 0; i < 18; i++) {
        const s = document.createElement('div');
        s.className = 'sparkle';
        const angle = (i / 18) * 360;
        const dist  = 80 + Math.random() * 80;
        const sx = Math.cos(angle * Math.PI / 180) * dist;
        const sy = Math.sin(angle * Math.PI / 180) * dist;
        s.style.setProperty('--sx', sx + 'px');
        s.style.setProperty('--sy', sy + 'px');
        s.style.left = '50%';
        s.style.top  = '50%';
        s.style.background = ['#ffd700', '#ff6b6b', '#48dbfb', '#ff9ff3', '#feca57'][Math.floor(Math.random() * 5)];
        s.style.animation = `sparklePop ${0.5 + Math.random() * 0.4}s ease-out ${Math.random() * 0.3}s forwards`;
        container.appendChild(s);
      }
    }

    /* ── Game flow ──────────────────────────────────── */
    document.querySelectorAll('.choice-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const userChoice = btn.dataset.choice;
        const cpuChoice  = LOSING_CHOICE[userChoice];

        /* State 1.2 — Showdown */
        userPickImg.src = ASSETS[userChoice];
        cpuPickImg.src  = ASSETS[cpuChoice];

        /* Reset animations by re-cloning images */
        const userImg = userPickImg.parentElement;
        const cpuImg  = cpuPickImg.parentElement;
        userImg.classList.remove('user-card');
        cpuImg.classList.remove('cpu-card');
        void userImg.offsetWidth;            /* force reflow */
        userImg.classList.add('user-card');
        cpuImg.classList.add('cpu-card');

        showOnly(showdownScreen);

        /* After showdown pause → State 1.3 WIN */
        setTimeout(() => {
          showOnly(winScreen);
          winScreen.querySelector('.win-text').classList.remove('win-fade-out');
          void winScreen.querySelector('.win-text').offsetWidth;
          createBurstParticles();

          /* State 2.1 — hold 2 s then fade */
          setTimeout(() => {
            winScreen.querySelector('.win-text').classList.add('win-fade-out');

            /* State 2.2 — Gift box drops */
            setTimeout(() => {
              showOnly(giftScreen);
              /* restart drop animation */
              giftBox.classList.remove('gift-drop');
              void giftBox.offsetWidth;
              giftBox.classList.add('gift-drop');
            }, 800);
          }, 2000);
        }, 1400);
      });
    });

    /* State 2.3 — Open gift box */
    giftBox.addEventListener('click', () => {
      showOnly(candyScreen);
      /* Clear old sparkles */
      candyReveal.querySelectorAll('.sparkle').forEach(s => s.remove());
      /* Re-trigger candy pop */
      const img = candyReveal.querySelector('img');
      img.style.animation = 'none';
      void img.offsetWidth;
      img.style.animation = '';
      createSparkles();
    });

    /* Play again */
    playAgainBtn.addEventListener('click', () => {
      showOnly(selectionScreen);
    });
  </script>
</body>
</html>
